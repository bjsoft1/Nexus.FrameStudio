CE · NO EFFECTS':'ILLUSTRATIVE PREVIEW'}</div>${opts.crop?'<div class="scene-crop"></div>':''}${opts.region?`<div class="region-handle" id="captureRegion"><span class="region-label">${S.capture.regionW} × ${S.capture.regionH} · drag to move</span></div>`:''}</div>`;}

const CAPTURE_DESCRIPTIONS={system:['System audio','volume','PC playback saved as an independent audio file.'],mic:['Microphone','mic','Your voice is never mixed permanently into the system track.'],camera:['Webcam','camera','An independent video source, not burned into the screen.'],mouse:['Mouse & clicks','cursor','Frame-aligned pointer position, shape, buttons and scroll.'],keys:['Keyboard shortcuts','keyboard','Allowed shortcuts only. No ordinary typed text.']};

'review-checklist':()=>`<div class="two-col wide-left"><div class="stack">${card('Design acceptance checklist',`${REVIEW_ITEMS.map(([id,title,desc])=>`<label class="review-row"><input type="checkbox" data-review="${id}" ${S.review.marks[id]?'checked':''}><span><b>${title}</b><p>${desc}</p></span></label>`).join('')}`)}${notice('Approving this design does not approve production code. The five implementation phases and their manual/automated test cases will be prepared after your approval.','neutral')}</div><div class="stack">${card('Your review',`<div class="between"><div><div class="review-score" id="reviewScore">${Object.values(S.review.marks).filter(Boolean).length}<span style="font-size:18px;color:var(--muted)"> / ${REVIEW_ITEMS.length}</span></div><div class="tiny muted" style="margin-top:5px">Checklist items reviewed</div></div>${icon('checkCircle','lg')}</div><div class="rule"></div>${select('Design decision','review.status',['Not reviewed','Changes requested','Approved for phase planning'])}${field('Notes and requested changes','review.notes','textarea')}${btn('Export review notes','export-review','download','primary')}<div style="margin-top:12px">${linkBtn('Review all screens','page-map','map')}</div>`)}${card('What happens next',`<div class="step-list"><div class="step-item"><div><b>You review this prototype.</b><span>Layout, features, capture/edit behavior and missing states.</span></div></div><div class="step-item"><div><b>You approve or request changes.</b><span>Use per-page feedback and export your notes.</span></div></div><div class="step-item"><div><b>Then create five development phases.</b><span>Each with UI steps, expected results, manual/auto tests and remaining work.</span></div></div></div>`)}</div></div>`
};
function assetTable(){if(!S.assets.length)return `<div class="empty-state">${icon('folder')}<div>No local files imported yet.</div><div class="tiny" style="margin-top:5px">The editor already includes an illustrative demo session.</div></div>`;return `<table class="data-table"><thead><tr><th>File</th><th>Type</th><th>Preview</th></tr></thead><tbody>${S.assets.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.type)}</td><td>${assetURLs.has(a.id)?tag('Linked','green'):tag('Needs relink','amber')}</td></tr>`).join('')}</tbody></table>`;}
function ovField(label,key,type='number',opts={}){const o=selected();if(!o)return '';const v=o[key]??'';let el;if(type==='textarea')el=`<textarea data-ov="${key}" aria-label="${label}">${esc(v)}</textarea>`;else if(type==='range')el=`<input type="range" data-ov="${key}" aria-label="${label}" min="${opts.min??0}" max="${opts.max??100}" step="${opts.step??1}" value="${v}">`;else if(type==='color')el=`<input type="color" data-ov="${key}" aria-label="${label}" value="${v||'#b6a6ff'}">`;else el=`<input type="${type}" data-ov="${key}" aria-label="${label}" value="${esc(v)}" ${opts.min!==undefined?`min="${opts.min}"`:''} ${opts.max!==undefined?`max="${opts.max}"`:''} step="${opts.step??1}">`;return `<label class="field"><span class="field-label">${label}${type==='range'?`<span class="range-value">${v}${opts.unit||''}</span>`:''}</span>${el}</label>`;}
function layerControls(){const o=selected();if(!o)return notice('Add or select an overlay to edit its transform.','neutral');return `<div class="between"><h3>Transform</h3>${tag(o.type,'purple')}</div><div class="field-grid">${ovField('X · %','x','number',{min:0,max:100,step:.5})}${ovField('Y · %','y','number',{min:0,max:100,step:.5})}${ovField('Width · %','w','number',{min:2,max:100,step:.5})}${ovField('Height · %','h','number',{min:2,max:100,step:.5})}</div>${ovField('Rotation','rotation','range',{min:-180,max:180,unit:'°'})}${ovField('Opacity','opacity','range',{min:0,max:100,unit:'%'})}<div class="field-grid">${ovField('Start · seconds','start','number',{min:0,max:total(),step:.1})}${ovField('End · seconds','end','number',{min:0,max:total(),step:.1})}</div><div class="cluster">${btn('Back','layer-back','layers','small')}${btn('Front','layer-front','layers','small')}${btn('','duplicate-overlay','copy','icon-btn','aria-label="Duplicate overlay"')}${btn('','delete-overlay','trash','icon-btn danger','aria-label="Delete overlay"')}</div><div class="rule"></div>${notice('Drag the selected overlay in the preview. Its corner handle resizes it. Numeric controls provide precise edits.','neutral')}`;}
function layerList(){return `<div class="layer-list">${S.overlays.slice().reverse().map(o=>`<div class="layer-row ${S.edit.selectedOverlay===o.id?'selected':''}" data-select-overlay="${o.id}" role="button" tabindex="0">${icon(o.type==='text'?'text':o.type==='image'?'image':o.type==='video'?'film':'shape')}<span class="grow">${esc(o.name)}</span><button class="subtle icon-btn" data-layer-toggle="${o.id}" aria-label="Toggle visibility of ${esc(o.name)}">${icon(o.visible?'eye':'eyeOff')}</button></div>`).join('')||'<div class="tiny muted">No overlays yet.</div>'}</div>`;}
function toolShelf(p){let content='';const id=p.id;if(['editor','media-bin','trim-split','join','crop','resize-quality','speed','color'].includes(id))content=`<div class="between" style="margin-bottom:12px"><span class="eyebrow">Media bin</span>${btn('','import-media','plus','icon-btn','aria-label="Import media into bin"')}</div><div class="asset-grid">${[['Screen take 01','film','00:42',''],['Camera source','camera','00:42','green'],['System audio','volume','00:42','green'],['Microphone','mic','00:42','warm']].map(([n,i,d,c],idx)=>`<button class="asset" data-action="select-demo-source" data-source="${idx}" title="${n}"><div class="asset-thumb ${c}">${icon(i,'lg')}<span>${d}</span></div><div class="asset-name">${n}</div><div class="asset-type">${idx<2?'VIDEO':'AUDIO'} · DEMO</div></button>`).join('')}${S.assets.map(a=>`<button class="asset" data-asset="${a.id}"><div class="asset-thumb">${icon(a.type==='image'?'image':a.type==='audio'?'volume':'film','lg')}<span>${assetURLs.has(a.id)?'LOCAL':'RELINK'}</span></div><div class="asset-name">${esc(a.name)}</div><div class="asset-type">${esc(a.type.toUpperCase())}</div></button>`).join('')}</div><div style="margin-top:13px">${btn('Import media','import-media','upload','small','style="width:100%"')}</div><div class="rule"></div><div class="between" style="margin-bottom:10px"><span class="eyebrow">Overlay layers</span>${btn('','add-text','plus','icon-btn','aria-label="Add text overlay"')}</div>${layerList()}<div class="shelf-tip">${id==='join'?'Drag clips on the timeline to reorder them. The inspector provides move-left and move-right buttons too.':id==='trim-split'?'Click the ruler to seek. Press S to split. Select a clip before deleting it.':'Click an imported asset to append a clip or place it as an overlay. Source media stays unchanged.'}</div>`;
else if(['text','formatted-text'].includes(id))content=`<span class="eyebrow">Text presets</span><div class="tool-list" style="margin-top:14px">${[['Headline','A strong, clear introduction'],['Lower third','A name and a little context'],['Minimal label','Small and unobtrusive'],['Formatted text','Mixed emphasis in one layer']].map(([n,d])=>`<button class="tool-tile" data-text-preset="${n}">${icon('text')}<span>${n}<small>${d}</small></span></button>`).join('')}</div><div class="rule"></div>${layerList()}<div class="shelf-tip">Text is a timed overlay, not part of the source frames. Double-click/select the layer, then edit its content and formatting.</div>`;
else if(id==='shapes')content=`<span class="eyebrow">Visual annotations</span><div class="shape-buttons" style="margin-top:14px">${['Rectangle','Circle','Arrow','Line','Highlight','Rounded'].map(n=>`<button data-add-shape="${n.toLowerCase()}">${icon(n==='Circle'?'circle':n==='Arrow'?'arrow':n==='Line'?'line':n==='Highlight'?'frame':'rectangle')}${n}</button>`).join('')}</div><div class="rule"></div>${layerList()}<div class="shelf-tip">Each shape has its own layer, range, transform and opacity. Hide or remove it without changing the video.</div>`;
else if(['image-overlay','video-overlay'].includes(id))content=`<span class="eyebrow">Picture-in-picture</span><div class="tool-list" style="margin-top:14px">${btn('Import image or video','import-media','upload','tool-tile')}${btn('Add demo image','add-image','image','tool-tile')}${btn('Camera layout controls','go-webcam','camera','tool-tile')}</div><div class="rule"></div><span class="eyebrow">Local assets</span><div class="tool-list" style="margin-top:10px">${S.assets.map(a=>`<button class="tool-tile" data-overlay-asset="${a.id}">${icon(a.type==='image'?'image':'film')}<span>${esc(a.name)}<small>${a.type} overlay</small></span></button>`).join('')||'<div class="shelf-tip">Import a local image or video, then click it here to place it above the main video.</div>'}</div><div class="rule"></div>${layerList()}`;
else if(id==='animation')content=`<span class="eyebrow">Motion presets</span><div class="tool-list" style="margin-top:14px">${['Fade in','Slide up','Scale in','Rotate in','None'].map(n=>`<button class="tool-tile ${S.edit.animation===n?'selected':''}" data-set="edit.animation" data-value="${n}">${icon('diamond')}${n}</button>`).join('')}</div><div class="rule"></div>${layerList()}<div class="shelf-tip">Select a layer, set the playhead and add a keyframe. Position, size, rotation and opacity are stored as a full pose.</div>`;
else if(id==='transitions')content=`<span class="eyebrow">Transitions</span><div class="tool-list" style="margin-top:14px">${['Cut','Dissolve','Slide left','Slide right'].map(n=>`<button class="tool-tile ${S.edit.transition===n?'selected':''}" data-set="edit.transition" data-value="${n}"><span class="transition-swatch"></span><span>${n}<small>Between adjacent clips</small></span></button>`).join('')}</div><div class="shelf-tip">Transitions are visual simulations here. The native renderer must validate overlap duration and blend both video and audio correctly.</div>`;
else if(id==='captions')content=`<span class="eyebrow">Subtitle cues</span><div class="tool-list" style="margin-top:14px">${S.edit.captions.map(c=>`<button class="tool-tile" data-caption="${c.id}"><span><span class="mono tiny accent">${time(c.start)} — ${time(c.end)}</span><small style="margin-top:4px;font-size:10px;color:var(--text)">${esc(c.text)}</small></span></button>`).join('')}</div><div class="rule"></div>${btn('Add caption at playhead','add-caption','plus','small')}<div class="shelf-tip">Caption text and timing can be changed without touching the source recording. Export an actual SRT sidecar from the inspector.</div>`;
else if(['editor-mouse','editor-keys'].includes(id))content=`<span class="eyebrow">Captured events</span><div class="tool-list" style="margin-top:14px">${(id==='editor-mouse'?[['click-1','Left click','00:02.400'],['click-2','Right click','00:12.400'],['scroll-1','Scroll down','00:23.200']]:[['key-1','Ctrl + C','00:03.100'],['key-2','Ctrl + Shift + K','00:12.400'],['key-3','Ctrl + V','00:28.200']]).map(([key,n,t])=>`<button class="tool-tile" data-event="${key}" ${!(captured(id==='editor-mouse'?'mouse':'keys'))?'disabled':''}>${icon(S.edit.hiddenEvents.includes(key)?'eyeOff':id==='editor-mouse'?'cursor':'keyboard')}<span>${n}<small>${t} · ${S.edit.hiddenEvents.includes(key)?'Hidden':'Visible'}</small></span></button>`).join('')}</div><div style="margin-top:14px">${btn('Restore source events','restore-events','reset','small',!captured(id==='editor-mouse'?'mouse':'keys')?'disabled':'')}</div><div class="shelf-tip">Click an event to hide/restore its visual effect. Original metadata stays intact. No events can be restored from an uncaptured source.</div>`;
else if(id==='audio-mixer')content=`<span class="eyebrow">Audio sources</span><div class="tool-list" style="margin-top:14px"><a href="#audio-mixer" class="tool-tile">${icon('volume')}<span>System audio<small>${captured('system')?'Independent captured source':'Not captured'}</small></span></a><a href="#audio-mixer" class="tool-tile">${icon('mic')}<span>Microphone<small>${captured('mic')?'Independent captured source':'Not captured'}</small></span></a>${btn('Import music or narration','import-media','plus','tool-tile')}</div><div class="shelf-tip">The meters are synthetic. Audio gain and fades are editable state, not a full real-time mixer. Imported audio can be previewed natively by the browser.</div>`;
else content=`<span class="eyebrow">Canvas presets</span><div class="tool-list" style="margin-top:14px">${['16:9','9:16','1:1','4:3'].map(r=>`<button class="tool-tile ${S.edit.canvasRatio===r?'selected':''}" data-set="edit.canvasRatio" data-value="${r}">${icon('frame')}<span>${r}<small>${r==='16:9'?'Landscape':r==='9:16'?'Portrait':r==='1:1'?'Square':'Classic'}</small></span></button>`).join('')}</div><div class="rule"></div>${layerList()}`;
return `<aside class="editor-shelf"><div class="shelf-tabs"><a href="#media-bin" class="active">${id==='editor'?'Media':p.title.split(' &')[0]}</a><a href="#import">Import</a></div><div class="shelf-content">${content}</div></aside>`;}
function inspector(p){const id=p.id,c=selectedClip(),o=selected();let b='';if(id==='editor'||id==='media-bin')b=`<div class="between"><h3>Selected layer</h3>${tag(o?o.type:'None','purple')}</div>${o?`<div class="small-text" style="margin-bottom:12px">${esc(o.name)}</div>`:''}${layerControls()}<div class="rule"></div><h3>Captured sources</h3>${toggle('Pointer effects','edit.mouse','',!captured('mouse'))}${toggle('Keyboard effects','edit.keys','',!captured('keys'))}`;
else if(id==='trim-split')b=`<h3>Selected clip</h3><div class="small-text accent">${esc(c?.name||'No clip selected')}</div><div class="rule"></div>${c?`<div class="field-grid"><label class="field"><span class="field-label">Source in · seconds</span><input class="text-input" type="number" data-clip="in" min="0" step="0.1" value="${c.in}"></label><label class="field"><span class="field-label">Length · seconds</span><input class="text-input" type="number" data-clip="duration" min="0.1" step="0.1" value="${c.duration}"></label></div><div class="cluster">${btn('Split at playhead','split','scissors','small')}${btn('Delete clip','delete-clip','trash','small danger')}</div>`:''}<div class="rule"></div>${notice('Click a clip to select it. Click the ruler to seek, then split. Source in/length are non-destructive trim edits.','neutral')}<div class="rule"></div>${btn('Fit timeline','fit-timeline','full','small')}`;
else if(id==='join')b=`<h3>Sequence order</h3>${S.clips.map((c,i)=>`<div class="clip-sort-item ${c.id===S.edit.selectedClip?'selected':''}" data-select-clip="${c.id}">${icon('grip')}<span class="grow">${i+1}. ${esc(c.name)}</span><span class="tiny muted">${time(c.duration)}</span></div>`).join('')}<div class="cluster" style="margin-top:13px">${btn('Move left','clip-left','back','small')}${btn('Move right','clip-right','chevron','small')}</div><div class="rule"></div>${btn('Append demo clip','append-demo','plus','small')}<div class="rule"></div>${notice('Clips are joined by sequence order. Dragging or moving a clip changes the output order, not the source files.','neutral')}`;
else if(id==='crop')b=`<h3>Source crop</h3>${segments('edit.cropRatio',['16:9','1:1','9:16','Free'])}<div class="field-grid">${field('Left · px','edit.cropX','number',{min:0,max:1918})}${field('Top · px','edit.cropY','number',{min:0,max:1078})}${field('Width · px','edit.cropW','number',{min:2,max:1920})}${field('Height · px','edit.cropH','number',{min:2,max:1080})}</div>${btn('Reset to source frame','reset-crop','reset','small')}<div class="rule"></div>${notice('The crop guide previews the selected area. Production export must apply this same transform to pointer coordinates and source-anchored overlays.','neutral')}`;
else if(id==='resize-quality')b=`<h3>Resize without source loss</h3>${select('Output size','edit.resize',['1280 × 720','1920 × 1080','2560 × 1440','3840 × 2160'])}${select('Quality profile','edit.quality',['Small file','Balanced','High quality'])}${range('Video bitrate','edit.bitrate',1,40,' Mbps')}<div class="rule"></div><div class="between tiny"><span class="muted">Est. video-only file size</span><b>${(total()*S.edit.bitrate/8).toFixed(1)} MB</b></div><div class="rule"></div>${notice('Reducing quality only affects an export copy. It does not replace or degrade the source recording.','neutral')}<div style="margin-top:15px">${btn('Use in export','apply-quality','download','small primary')}</div>`;
else if(['text','formatted-text'].includes(id))b=`<h3>${id==='formatted-text'?'Formatted text':'Text content'}</h3>${ovField('Content','text','textarea')}<div class="format-bar">${btn('<b>B</b>','format-bold','',''+(o?.bold?'selected':''),'aria-label="Bold text"')}${btn('<i>I</i>','format-italic','',''+(o?.italic?'selected':''),'aria-label="Italic text"')}${btn('<u>U</u>','format-underline','',''+(o?.underline?'selected':''),'aria-label="Underline text"')}${id==='formatted-text'?btn('Aa','format-span','','','aria-label="Emphasize final word"'):''}</div>${ovField('Font size · source px','fontSize','range',{min:16,max:120,unit:' px'})}${ovField('Text color','color','color')}${id==='formatted-text'?notice('Aa emphasizes the final word as a separate rich-text span. Other controls style the whole text block.','neutral'):''}<div class="rule"></div>${layerControls()}`;
else if(['shapes','image-overlay','video-overlay'].includes(id))b=`<h3>${o?esc(o.name):'Overlay properties'}</h3>${id==='shapes'?ovField('Shape color','color','color'):''}${id==='video-overlay'?`${toggle('Show captured webcam','edit.camera',captured('camera')?'Recorded independently; reversible visibility.':'No captured camera is available.',!captured('camera'))}${select('Camera frame','capture.cameraShape',['Rounded rectangle','Circle','Rectangle'])}${range('Camera size','capture.cameraSize',12,40,'%')}<div class="rule"></div>`:''}${layerControls()}`;
else if(id==='animation')b=`<h3>Animation</h3>${select('Entrance preset','edit.animation',['Fade in','Slide up','Scale in','Rotate in','None'])}${range('Duration','edit.animationDuration',100,2500,' ms',100)}<div class="cluster">${btn('Preview','preview-animation','play','small primary')}${btn('Add keyframe','add-keyframe','diamond','small')}</div><div class="rule"></div><h3>Layer keyframes</h3>${o?.keyframes?.length?o.keyframes.map((k,i)=>`<div class="between small-text" style="padding:7px 0"><span class="mono">${timecode(k.time)}</span><span class="tiny muted">X ${k.x.toFixed(0)} · Y ${k.y.toFixed(0)}</span>${btn('','remove-keyframe','close','icon-btn',`data-index="${i}" aria-label="Remove keyframe ${i+1}"`)}</div>`).join(''):'<div class="tiny muted">No keyframes yet. Add one at the playhead.</div>'}<div class="rule"></div>${layerControls()}`;
else if(id==='transitions')b=`<h3>Between adjacent clips</h3>${select('Transition type','edit.transition',['Cut','Dissolve','Slide left','Slide right'])}${range('Duration','edit.transitionDuration',100,2000,' ms',100)}${btn('Preview transition','preview-transition','play','small primary')}<div class="rule"></div>${notice('The preview is a UI animation, not a rendered transition between decoded sources. The future timeline must validate clip overlap handles.','neutral')}`;
else if(id==='captions')b=`<h3>Caption editor</h3>${toggle('Show captions','edit.captionEnabled','Preview the active subtitle cue.')}${field('Caption text','edit.captionText','textarea')}<div class="field-grid">${field('Start · sec','edit.captionStart','number',{min:0,max:total(),step:.1})}${field('End · sec','edit.captionEnd','number',{min:0,max:total(),step:.1})}</div><div class="cluster">${btn('Apply cue','apply-caption','check','small primary')}${btn('Add cue','add-caption','plus','small')}</div><div class="rule"></div>${btn('Download .srt','export-srt','download','small')}<div class="rule"></div>${notice('Manual subtitle editing is in scope. Automatic speech transcription is not implemented in this prototype.','neutral')}`;
else if(id==='editor-mouse')b=`<div class="between"><h3>Pointer source</h3>${availability('mouse')}</div>${toggle('Show cursor','edit.mouse',captured('mouse')?'Non-destructive visibility.':'Unavailable: mouse data was not captured.',!captured('mouse'))}${toggle('Show click effects','edit.clicks','Can be changed globally or per event.',!captured('mouse'))}${range('Cursor size','capture.cursorSize',16,64,' px')}${field('Highlight color','capture.highlightColor','color')}${range('Highlight opacity','capture.highlightOpacity',0,100,'%')}${select('Click style','capture.clickStyle',['Ripple','Ring','Pulse'])}<div class="rule"></div>${notice('The source MP4 must be cursor-free for removal to work. A cursor already burned into an imported video cannot be switched off.','warning')}`;
else if(id==='editor-keys')b=`<div class="between"><h3>Keyboard source</h3>${availability('keys')}</div>${toggle('Show keyboard overlay','edit.keys',captured('keys')?'Hide or restyle recorded shortcuts.':'Unavailable: no keyboard events were captured.',!captured('keys'))}${select('Keycap style','capture.keyStyle',['Soft glass','Solid keycaps','Minimal text','Light keycaps'])}${select('Position','capture.keyPosition',['Bottom center','Bottom left','Bottom right','Top center'])}${range('Font size','capture.keySize',12,40,' px')}${range('Display duration','capture.keyDuration',300,4000,' ms',100)}${field('Text color','capture.keyColor','color')}<div class="rule"></div>${notice('Hiding a key effect does not delete the original event. Sanitizing source metadata is a separate confirmed action.','warning')}`;
else if(id==='audio-mixer')b=`<div class="between"><h3>System audio</h3>${availability('system')}</div>${toggle('Mute system audio','edit.systemMute',captured('system')?'Reversible edit; original sound remains.':'Unavailable: this source was never captured.',!captured('system'))}${range('System gain','edit.systemGain',0,150,'%')}${range('Fade in','edit.systemFadeIn',0,3000,' ms',100)}<div class="rule"></div><div class="between"><h3>Microphone</h3>${availability('mic')}</div>${toggle('Mute microphone','edit.micMute',captured('mic')?'Does not mute system audio.':'Unavailable: this source was never captured.',!captured('mic'))}${range('Microphone gain','edit.micGain',0,150,'%')}${range('Fade out','edit.micFadeOut',0,3000,' ms',50)}<div class="rule"></div>${meter()}<div class="tiny muted" style="margin-top:8px">Synthetic level illustration. No real mixed-audio playback.</div>${S.assets.filter(a=>a.type==='audio'&&assetURLs.has(a.id)).map(a=>`<div class="field"><div class="field-label">${esc(a.name)}</div><audio controls src="${esc(assetURLs.get(a.id))}" style="width:100%;height:32px"></audio></div>`).join('')}`;
else if(id==='speed')b=`<h3>Playback timing</h3>${select('Selected clip speed','edit.speed',[0.5,0.75,1,1.25,1.5,2])}${toggle('Preserve voice pitch','edit.pitch','A proposed export processing option; not a real-time DSP effect here.')}<div class="rule"></div>${notice('The prototype timeline maps this clip’s output time to source time. The native renderer must use that mapping for audio, cursor, keys, webcam and source-anchored effects.','neutral')}<div class="rule"></div><div class="between tiny"><span>Current sequence</span><b>${time(total())}</b></div>`;
else if(id==='color')b=`<h3>Source adjustments</h3>${range('Brightness','edit.brightness',50,150,'%')}${range('Contrast','edit.contrast',50,150,'%')}${range('Saturation','edit.saturation',0,180,'%')}${btn('Reset adjustments','reset-color','reset','small')}<div class="rule"></div>${notice('CSS preview filters illustrate the controls. Color-managed native processing and export matching remain future work.','neutral')}`;

function searchScreens(q){const results=PAGES.filter(p=>(p.title+' '+p.description+' '+p.group).toLowerCase().includes(q.toLowerCase()));$('#screenSearchResults').innerHTML=results.map(p=>`<a href="#${p.id}" class="search-result" data-close-search="true"><span class="mono accent">${String(p.number).padStart(2,'0')}</span>${icon(pageIcon[p.id])}<span>${p.title}</span><small>${p.group}</small></a>`).join('')||'<div class="empty-state">No matching screen. Try “audio”, “overlay” or “export”.</div>';}
function applyPreset(name){S.capture.preset=name;const c=S.capture;if(name==='Tutorial')Object.assign(c,{resolution:'1920 × 1080',fps:30,bitrate:12,mouse:true,keys:true,system:true,mic:true,camera:true});if(name==='Quick capture')Object.assign(c,{resolution:'1920 × 1080',fps:30,bitrate:8,system:true,mic:false,camera:false,keys:false});if(name==='Presentation')Object.assign(c,{resolution:'1920 × 1080',fps:30,bitrate:12,mic:true,camera:true});if(name==='High quality')Object.assign(c,{resolution:'3840 × 2160',fps:60,bitrate:35});if(name==='Small file')Object.assign(c,{resolution:'1280 × 720',fps:24,bitrate:3,camera:false});}
function onBoundInput(el){let value=el.type==='checkbox'?el.checked:el.type==='range'||el.type==='number'?Number(el.value):el.value;if((el.type==='range'||el.type==='number')&&!Number.isFinite(value))return;if(el.type==='range'||el.type==='number'){if(el.min!=='')value=Math.max(Number(el.min),value);if(el.max!=='')value=Math.min(Number(el.max),value);}const path=el.dataset.bind;if(path){if(typeof get(path)==='number')value=Number(value);set(path,value);if(path==='capture.preset')applyPreset(value);if(path==='edit.speed'){const c=selectedClip();if(c)c.speed=Number(value);}if(path==='edit.cropRatio'){const choices={'16:9':[0,0,1920,1080],'1:1':[420,0,1080,1080],'9:16':[656,0,608,1080]};const v=choices[value];if(v)[S.edit.cropX,S.edit.cropY,S.edit.cropW,S.edit.cropH]=v;}if(path.startsWith('capture.region'))normalizeRegion();}else if(el.dataset.ov){const o=selected();if(o){o[el.dataset.ov]=value;if(['x','y','w','h'].includes(el.dataset.ov))o[el.dataset.ov]=clamp(value,el.dataset.ov==='w'||el.dataset.ov==='h'?2:0,100);}}
persist();const label=el.closest('.field');if(label){const output=$('.range-value',label);if(output){const unit=output.textContent.replace(/[-\d.]/g,'');output.textContent=value+unit;}const color=$('.color-value',label);if(color)color.textContent=value;}updateScene();updatePlayhead();const ce=$('#captureEstimate');if(ce)ce.textContent=(S.capture.bitrate*7.5).toFixed(0)+' MB';const ee=$('#exportEstimate');if(ee)ee.textContent=(total()*S.export.bitrate/8).toFixed(1)+' MB';}
document.addEventListener('click',e=>{const el=e.target.closest('button,[data-select-clip],[data-select-overlay],[data-close-search],[data-clip-id]');if(!el)return;if(el.disabled)return;if(el.dataset.action){const a=el.dataset.action;if(a.startsWith('inspect-')){inspectMode=a.slice(8);render();}else if(actions[a])actions[a](el);return;}if(el.dataset.toggle){const path=el.dataset.toggle;snapshot();const isSource=path.startsWith('capture.')&&Object.keys(CAPTURE_DESCRIPTIONS).includes(path.split('.')[1]);if(isSource&&['recording','paused'].includes(recordPhase))recordSegment();set(path,!get(path));if(isSource&&['recording','paused'].includes(recordPhase))S.session._armed=Object.fromEntries(Object.keys(CAPTURE_DESCRIPTIONS).map(k=>[k,S.capture[k]]));persist();render();return;}
if(el.dataset.set){snapshot();const old=get(el.dataset.set);set(el.dataset.set,typeof old==='number'?Number(el.dataset.value):el.dataset.value);if(el.dataset.set==='edit.cropRatio'){const p=el.dataset.value,config={'16:9':[0,0,1920,1080],'1:1':[420,0,1080,1080],'9:16':[656,0,608,1080]}[p];if(config)[S.edit.cropX,S.edit.cropY,S.edit.cropW,S.edit.cropH]=config;}persist();render();return;}

document.addEventListener('click',e=>{const seek=e.target.closest('[data-seek]');if(!seek||e.target.closest('.timeline-clip,.event-mark'))return;const rect=seek.getBoundingClientRect();stopPlayback();S.edit.playhead=clamp((e.clientX-rect.left)/rect.width*total()*1.03,0,total());persist();updatePlayhead();updateScene();});

document.addEventListener('change',e=>{const el=e.target;if(el.id==='filePicker'){handleFiles(el.files);return;}if(el.matches('[data-review]')){S.review.marks[el.dataset.review]=el.checked;persist();const score=$('#reviewScore');if(score)score.innerHTML=`${Object.values(S.review.marks).filter(Boolean).length}<span style="font-size:18px;color:var(--muted)"> / ${REVIEW_ITEMS.length}</span>`;return;}if(el.matches('[data-bind],[data-ov]')){onBoundInput(el);if(el.tagName==='SELECT'||el.dataset.bind==='edit.zoom')render();return;}if(el.dataset.clip){const c=selectedClip();if(!c)return;const value=Number(el.value);if(!Number.isFinite(value)||value<0){toast('Use a valid non-negative clip value.');render();return;}const source=S.assets.find(a=>a.id===c.sourceId),max=source?.duration||S.session.duration||42;if(el.dataset.clip==='in')c.in=clamp(value,0,Math.max(0,max-.1));if(el.dataset.clip==='duration')c.duration=clamp(value,.1,Math.max(.1,max-c.in));if(c.in+c.duration>max)c.duration=Math.max(.1,max-c.in);persist();render();}});
document.addEventListener('pointerdown',e=>{if(e.button!==0)return;const region=e.target.closest('#captureRegion'),overlay=e.target.closest('[data-overlay-id]');if(!region&&!overlay)return;const scene=$('#mainScene');if(!scene)return;snapshot();const bounds=scene.getBoundingClientRect();if(region){const r=region.getBoundingClientRect();drag={kind:'region',resize:e.clientX>r.right-16&&e.clientY>r.bottom-16,x:e.clientX,y:e.clientY,bounds,original:clone(S.capture),el:region};}else{const o=S.overlays.find(o=>o.id===overlay.dataset.overlayId);if(!o||o.locked)return;S.edit.selectedOverlay=o.id;$$('.overlay-item').forEach(n=>n.classList.toggle('selected',n===overlay));drag={kind:'overlay',resize:e.target.classList.contains('resize-handle'),x:e.clientX,y:e.clientY,bounds,original:clone(o),o,el:overlay};}e.preventDefault();});
document.addEventListener('pointermove',e=>{if(!drag)return;const d=drag,dx=(e.clientX-d.x)/d.bounds.width,dy=(e.clientY-d.y)/d.bounds.height;if(d.kind==='region'){const c=S.capture;if(d.resize){c.regionW=Math.round(d.original.regionW+dx*1920);c.regionH=Math.round(d.original.regionH+dy*1080);}else{c.regionX=clamp(d.original.regionX+dx*1920,0,1920-c.regionW);c.regionY=clamp(d.original.regionY+dy*1080,0,1080-c.regionH);}normalizeRegion();d.el.style.inset=`${c.regionY/1080*100}% ${(1920-c.regionX-c.regionW)/1920*100}% ${(1080-c.regionY-c.regionH)/1080*100}% ${c.regionX/1920*100}%`;$('.region-label',d.el).textContent=`${c.regionW} × ${c.regionH}`;}else{const o=d.o;if(d.resize){o.w=clamp(d.original.w+dx*100,2,100-o.x);o.h=clamp(d.original.h+dy*100,2,100-o.y);}else{o.x=clamp(d.original.x+dx*100,0,100-o.w);o.y=clamp(d.original.y+dy*100,0,100-o.h);}Object.assign(d.el.style,{left:o.x+'%',top:o.y+'%',width:o.w+'%',height:o.h+'%'});}});

let draggedClip=null;document.addEventListener('dragstart',e=>{const el=e.target.closest('[data-clip-id]');if(el){draggedClip=el.dataset.clipId;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggedClip);}});document.addEventListener('dragover',e=>{if(e.target.closest('[data-clip-id],#mediaDrop')){e.preventDefault();e.target.closest('#mediaDrop')?.classList.add('dragover');}});document.addEventListener('dragleave',e=>e.target.closest('#mediaDrop')?.classList.remove('dragover'));document.addEventListener('drop',e=>{const target=e.target.closest('[data-clip-id]'),zone=e.target.closest('#mediaDrop');if(zone){e.preventDefault();zone.classList.remove('dragover');importMode='media';handleFiles(e.dataTransfer.files);return;}if(target&&draggedClip){e.preventDefault();const from=S.clips.findIndex(c=>c.id===draggedClip),to=S.clips.findIndex(c=>c.id===target.dataset.clipId);if(from>=0&&to>=0&&from!==to)mutate(()=>{const c=S.clips.splice(from,1)[0];S.clips.splice(to,0,c);S.edit.selectedClip=c.id;});draggedClip=null;}});
document.addEventListener('keydown',e=>{const typing=e.target.matches('input,select,textarea,[contenteditable]'),dialog=$('.modal');if(dialog&&e.key==='Tab'){const focus=$$('button:not(:disabled),a[href],input,textarea,select',dialog),first=focus[0],last=focus.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}return;}if(e.key==='Escape'){if(dialog)closeModal();else stopPlayback();return;}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();actions.search();return;}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveProject();return;}if(typing||dialog)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();actions.undo();return;}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();actions.redo();return;}if(e.key==='Enter'&&e.target.matches('[data-select-overlay],[data-clip-id]')){e.target.click();return;}if(PAGES.find(p=>p.id===current)?.group==='Edit'){if(e.code==='Space'){e.preventDefault();play();}if(e.key.toLowerCase()==='s'){e.preventDefault();splitClip();}if(e.key==='ArrowLeft'){e.preventDefault();actions['frame-back']();}if(e.key==='ArrowRight'){e.preventDefault();actions['frame-forward']();}}});
